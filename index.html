<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Web App con Autenticación</title>
    
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 4px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .secondary-btn {
            background-color: #4b5563;
        }
        .secondary-btn:hover {
            background-color: #374151;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 1. Contenedor de Autenticación (Login / Registro) -->
        <div id="auth-container">
            <h2>Acceso a la Cuenta</h2>
            <input type="email" id="email" placeholder="Correo electrónico">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="signIn()">Iniciar Sesión</button>
            <button onclick="signUp()" class="secondary-btn">Registrarse</button>
        </div>

        <!-- 2. Contenedor Principal (Visible solo cuando se inicia sesión) -->
        <div id="app-container" style="display: none;">
            <h2>¡Bienvenido!</h2>
            <p><span id="user-email" style="font-weight: bold;"></span></p>
            <p>Plan actual: <span id="user-tier" style="color: #2563eb; font-weight: bold;">Cargando...</span></p>
            <button onclick="signOut()" class="secondary-btn">Cerrar Sesión</button>
        </div>
    </div>

    <!-- 3. Lógica de JavaScript -->
    <script>
        const SUPABASE_URL = 'https://jcvfndovnwfqacxuhegd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_C7L3U-1Wt78PtPog06WRgA_smUPA4AR';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Verificar el estado de la sesión al cargar la página
        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                document.getElementById('user-email').innerText = session.user.email;
                loadUserTier(session.user.id);
            } else {
                document.getElementById('auth-container').style.display = 'block';
                document.getElementById('app-container').style.display = 'none';
            }
        }

        // Función de Registro
        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                alert('Error en el registro: ' + error.message);
            } else {
                alert('¡Registro exitoso! Ya puedes iniciar sesión.');
            }
        }

        // Función de Inicio de Sesión
        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Error al iniciar sesión: ' + error.message);
            } else {
                checkUser();
            }
        }

        // Función de Cierre de Sesión
        async function signOut() {
            await supabase.auth.signOut();
            checkUser();
        }

        // Consultar el plan del usuario en la base de datos
        async function loadUserTier(userId) {
            const { data, error } = await supabase
                .from('profiles')
                .select('tier')
                .eq('id', userId)
                .single();
                
            if (data && data.tier) {
                document.getElementById('user-tier').innerText = data.tier.toUpperCase();
            } else {
                document.getElementById('user-tier').innerText = 'FREE';
            }
        }

        // Ejecutar al cargar la página
        window.onload = checkUser;
    </script>
</body>
</html>
