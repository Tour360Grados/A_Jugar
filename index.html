<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡A Jugar! - Estadísticas y Análisis</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b111e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 4px 2px;
      display: flex;
      justify-content: center;
    }
    .ticket-grid {
      display: grid;
      gap: 4px;
      margin-bottom: 8px;
    }
    .ticket-cell {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      font-size: 0.7rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ticket-cell.hot { background: #b91c1c; border-color: #ef4444; }
    .ticket-cell.cold { background: #1d4ed8; border-color: #3b82f6; }
    .ticket-cell.suggested { border: 2px solid #22c55e; }
    .count-badge { font-size: 0.55rem; color: #94a3b8; margin-top: 2px; }
    .btn-action {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }
    .ball {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: bold;
      color: #fff;
    }
    .balls-container {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.68rem;
    }
    .status-ok { color: #22c55e; }
    .status-out { color: #ef4444; }
  </style>
</head>
<body>

  <div id="app" style="width: 100%; max-width: 480px;">
    <!-- Contenedor del Radar -->
    <div id="radar-ticket-container"></div>
    <div id="frecuencias-lista"></div>
    <div id="rangos-metrics"></div>
    <div id="sugerencia-result"></div>
    <div id="mis-jugadas-lista"></div>
  </div>

  <script>
    // --- VARIABLES GLOBALES Y CONFIGURACIÓN ---
    let sugerenciaActual = [];
    let maxNumActual = 39;
    let datosHistoricos = [];
    let calientesGlobales = [];
    let friosGlobales = [];
    let usuarioPlan = 'free';
    let juegoActual = 'historico_melate';

    const NOMBRES_JUEGOS = {
      'historico_melate': 'Melate',
      'melate_retro': 'Melate Retro',
      'progol': 'Progol'
    };

    // Inicialización de Supabase (Reemplaza con tus credenciales reales si es necesario)
    const supabaseUrl = 'TU_SUPABASE_URL';
    const supabaseKey = 'TU_SUPABASE_ANON_KEY';
    const db = supabase.createClient(supabaseUrl, supabaseKey);

    // --- FUNCIONES AUXILIARES Y DE SOPORTE ---
    function obtenerHistorialJuego(juego) {
      return window.datosHistoricos || datosHistoricos;
    }

    function actualizarRadarSegunRango() {
      if (typeof renderizarRadar === 'function' && typeof datosHistoricos !== 'undefined') {
        renderizarRadar(datosHistoricos);
      }
    }

    function verSugerenciaEnRadar(propuesta) {
      sugerenciaActual = propuesta;
      actualizarRadarSegunRango();
    }

    function verBoletoEnRadar(juego, nums) {
      juegoActual = juego;
      sugerenciaActual = nums;
      actualizarRadarSegunRango();
    }

    function verificarEstadoPrueba() {}
    function aplicarRestriccionesPlan() {}
    async function cargarDatosCompletos() {}
    function mostrarPistaZoomMovil() {}

    // --- RENDERIZAR RADAR ---
    function renderizarRadar(historialMuestra) {
      const container = document.getElementById('radar-ticket-container');
      if (!container || !historialMuestra || historialMuestra.length === 0) return;

      const conteo = {};
      for (let i = 1; i <= maxNumActual; i++) conteo[i] = 0;

      historialMuestra.forEach(sorteo => {
        const nums = extraerNumeros(sorteo);
        nums.forEach(n => { if (conteo[n] !== undefined) conteo[n]++; });
      });

      const listaFrecuencias = [];
      for (let i = 1; i <= maxNumActual; i++) {
        listaFrecuencias.push({ num: i, hits: conteo[i] });
      }
      listaFrecuencias.sort((a, b) => b.hits - a.hits);

      const totalNum = maxNumActual;
      const tercioCount = Math.floor(totalNum / 3);
      
      const hotNums = new Set();
      const coldNums = new Set();

      for (let i = 0; i < totalNum; i++) {
        if (i < tercioCount) {
          hotNums.add(listaFrecuencias[i].num);
        } else if (i >= totalNum - tercioCount) {
          coldNums.add(listaFrecuencias[i].num);
        }
      }

      const maxCols = maxNumActual === 39 ? 4 : 6;
      let gridHtml = '<div class="ticket-grid" style="grid-template-columns: repeat(' + maxCols + ', minmax(0, 1fr));">';

      for (let r = 1; r <= 10; r++) {
        for (let c = 1; c <= maxCols; c++) {
          if (maxNumActual === 39) {
            if (r === 1 && c === 1) {
              gridHtml += '<div class="ticket-cell empty" style="background: #1e293b; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #94a3b8; font-weight: bold;">A.</div>';
              continue;
            }
            let num = null;
            if (c === 1) num = r - 1; 
            else if (c === 2) num = 9 + r; 
            else if (c === 3) num = 19 + r; 
            else if (c === 4) num = 29 + r; 

            const hitsVal = conteo[num];
            let claseEstado = 'warm';
            if (hotNums.has(num)) claseEstado = 'hot';
            else if (coldNums.has(num)) claseEstado = 'cold';

            const esSugerido = sugerenciaActual.includes(num);
            if (esSugerido) claseEstado += ' suggested';

            gridHtml += '<div class="ticket-cell ' + claseEstado + '" onclick="toggleNumeroRadar(' + num + ')">' +
                        '<span>' + num + '</span>' +
                        '<span class="count-badge">' + (hitsVal > 0 ? hitsVal + 'v' : '0v') + '</span>' +
                        '</div>';
          } else {
            const num = (c - 1) * 10 + r;
            if (num > maxNumActual) {
              gridHtml += '<div class="ticket-cell empty"></div>';
            } else {
              const hitsVal = conteo[num];
              let claseEstado = 'warm';
              if (hotNums.has(num)) claseEstado = 'hot';
              else if (coldNums.has(num)) claseEstado = 'cold';

              const esSugerido = sugerenciaActual.includes(num);
              if (esSugerido) claseEstado += ' suggested';

              gridHtml += '<div class="ticket-cell ' + claseEstado + '" onclick="toggleNumeroRadar(' + num + ')">' +
                          '<span>' + num + '</span>' +
                          '<span class="count-badge">' + (hitsVal > 0 ? hitsVal + 'v' : '0v') + '</span>' +
                          '</div>';
            }
          }
        }
      }
      gridHtml += '</div>';

      let controlesSugerenciaHtml = '<div style="margin-top: 8px; background: #0f172a; padding: 6px; border-radius: 6px; border: 1px solid #1e293b; display: flex; flex-direction: column; gap: 4px;">' +
        '<button class="btn-action" style="background: #4f46e5; font-size: 0.7rem; padding: 6px; margin: 0;" onclick="generarSugerenciaEnRadar()">🔮 Generar Nueva Sugerencia</button>';

      if (sugerenciaActual.length > 0) {
        const valHist = verificarUnicidad(sugerenciaActual);
        const textoSeleccion = sugerenciaActual.join(', ');
        const textoValHist = valHist.repetido ? '⚠️ Salió antes en sorteo #' + valHist.sorteoEncontrado : '✅ ¡Nunca ha salido!';
        const colorValHist = valHist.repetido ? '#ef4444' : '#22c55e';
        const strSugerenciaUnida = sugerenciaActual.join(',');

        let botonGuardarHtml = '';
        if (sugerenciaActual.length === 6) {
          botonGuardarHtml = '<button class="btn-action" style="background: #10b981; font-size: 0.68rem; padding: 6px; margin: 0;" onclick="guardarSugerenciaDirecta(\'' + strSugerenciaUnida + '\')">💾 Guardar Boleto Actual</button>';
        } else {
          botonGuardarHtml = '<div style="font-size: 0.6rem; color: #eab308; text-align: center;">Selecciona ' + (6 - sugerenciaActual.length) + ' número(s) más para guardar</div>';
        }

        controlesSugerenciaHtml += '<div style="font-size: 0.65rem; color: #10b981; font-weight: bold; text-align: center; margin-top: 2px;">' +
          '✨ Selección (' + sugerenciaActual.length + '/6): [ ' + textoSeleccion + ' ]' +
          '</div>' +
          '<div style="font-size: 0.62rem; text-align: center; color: ' + colorValHist + ';">' +
          textoValHist +
          '</div>' +
          botonGuardarHtml +
          '<button class="btn-action" style="background: #64748b; font-size: 0.68rem; padding: 6px; margin: 0;" onclick="limpiarSugerenciaRadar()">🧹 Limpiar Selección</button>';
      }

      controlesSugerenciaHtml += '<div id="msg-guardar-radar" style="font-size: 0.6rem; text-align: center;"></div>' +
        '</div>';

      container.innerHTML = '<div style="width: 100%;">' + gridHtml + controlesSugerenciaHtml + '</div>';
    }

    function toggleNumeroRadar(num) {
      const index = sugerenciaActual.indexOf(num);
      if (index > -1) {
        sugerenciaActual.splice(index, 1);
      } else {
        if (sugerenciaActual.length >= 6) {
          alert('Ya has seleccionado 6 números.');
          return;
        }
        sugerenciaActual.push(num);
        sugerenciaActual.sort((a, b) => a - b);
      }
      actualizarRadarSegunRango();
    }

    function limpiarSugerenciaRadar() {
      sugerenciaActual = [];
      actualizarRadarSegunRango();
    }

    function generarSugerenciaEnRadar() {
      const bolsa = new Set();
      while (bolsa.size < 6) {
        bolsa.add(Math.floor(Math.random() * maxNumActual) + 1);
      }
      sugerenciaActual = Array.from(bolsa).sort((a, b) => a - b);
      actualizarRadarSegunRango();
    }

    function actualizarFrecuenciasSegunRango() {
      const select = document.getElementById('select-freq-rango');
      const val = select ? select.value : 'todos';
      let datosMuestra = datosHistoricos;

      if (val !== 'todos') {
        const limite = parseInt(val);
        datosMuestra = datosHistoricos.slice(0, limite);
      }
      calcularFrecuencias(datosMuestra);
    }

    function calcularFrecuencias(muestraSorteos) {
      const conteo = {};
      for (let i = 1; i <= maxNumActual; i++) conteo[i] = 0;
      muestraSorteos.forEach(sorteo => {
        const nums = extraerNumeros(sorteo);
        nums.forEach(n => { if (conteo[n] !== undefined) conteo[n]++; });
      });

      const ordenados = Object.keys(conteo).map(Number).sort((a, b) => conteo[b] - conteo[a]);
      calientesGlobales = ordenados.slice(0, 6);
      friosGlobales = ordenados.slice(-6);
      const maxVeces = conteo[ordenados[0]] || 1;

      const htmlFrecuencias = ordenados.map((num) => {
        const veces = conteo[num];
        const porcentajeBarra = Math.round((veces / maxVeces) * 100);

        let claseBall = 'ball freq-ball';
        if (calientesGlobales.includes(num)) {
          claseBall += ' hot';
        } else if (friosGlobales.includes(num)) {
          claseBall += ' cold';
        }

        return '<div class="freq-row">' +
          '<div class="' + claseBall + '" style="background: radial-gradient(circle at 30% 30%, var(--ball-light, #38bdf8), var(--ball-dark, #0369a1)); box-shadow: inset -3px -3px 6px rgba(0,0,0,0.6), 0 3px 6px rgba(0,0,0,0.4);">' + num + '</div>' +
          '<div class="freq-bar-container"><div class="freq-bar" style="width: ' + porcentajeBarra + '%;"></div></div>' +
          '<div class="freq-count">' + veces + 'v</div>' +
          '</div>';
      }).join('');

      const listaEl = document.getElementById('frecuencias-lista');
      if (listaEl) listaEl.innerHTML = htmlFrecuencias;
    }

    function calcularRangos(ultimos20) {
      if (!ultimos20 || ultimos20.length === 0) return;
      let sumaTotalAccum = 0;
      let minSuma = Infinity;
      let maxSuma = -Infinity;

      ultimos20.forEach(sorteo => {
        const nums = extraerNumeros(sorteo);
        const suma = nums.reduce((a, b) => a + b, 0);
        sumaTotalAccum += suma;
        if (suma < minSuma) minSuma = suma;
        if (suma > maxSuma) maxSuma = suma;
      });

      const promSuma = Math.round(sumaTotalAccum / ultimos20.length);

      const metricsEl = document.getElementById('rangos-metrics');
      if (metricsEl) {
        metricsEl.innerHTML = '<div class="metric-row">' +
          '<span class="metric-label">Suma Mínima:</span>' +
          '<span class="metric-value" style="color: #38bdf8;">' + minSuma + ' pts</span>' +
          '</div>' +
          '<div class="metric-row">' +
          '<span class="metric-label">Suma Máxima:</span>' +
          '<span class="metric-value" style="color: #ef4444;">' + maxSuma + ' pts</span>' +
          '</div>' +
          '<div class="metric-row">' +
          '<span class="metric-label">Promedio Suma Total:</span>' +
          '<span class="metric-value status-ok">' + promSuma + ' pts</span>' +
          '</div>';
      }
    }

    function verificarUnicidad(numsArr) {
      const sortedTarget = [...numsArr].map(Number).sort((a, b) => a - b);
      for (let sorteo of datosHistoricos) {
        const sNums = [...extraerNumeros(sorteo)].map(Number).sort((a, b) => a - b);
        if (sNums.length === sortedTarget.length && sNums.every((val, idx) => val === sortedTarget[idx])) {
          return { repetido: true, sorteoEncontrado: sorteo.sorteo || sorteo.numero_sorteo || sorteo.id };
        }
      }
      return { repetido: false };
    }

    function analizarCoincidenciasParcialesConHistorial(numsBoleto, historial) {
      const setBoleto = new Set(numsBoleto.map(Number));
      let aciertos6 = 0;
      let aciertos5 = 0;
      let aciertos4 = 0;
      let sorteos6 = [];
      let detalles5 = [];
      let detalles4 = [];

      historial.forEach(sorteo => {
        const sNums = extraerNumeros(sorteo).map(Number);
        const numerosAcertados = sNums.filter(n => setBoleto.has(n));
        const matches = numerosAcertados.length;

        const numSorteo = sorteo.sorteo || sorteo.numero_sorteo || sorteo.id;
        if (matches === 6) {
          aciertos6++;
          sorteos6.push(numSorteo);
        } else if (matches === 5) {
          aciertos5++;
          detalles5.push({ sorteo: numSorteo, numeros: numerosAcertados.sort((a,b) => a - b) });
        } else if (matches === 4) {
          aciertos4++;
          detalles4.push({ sorteo: numSorteo, numeros: numerosAcertados.sort((a,b) => a - b) });
        }
      });

      return { aciertos6, aciertos5, aciertos4, sorteos6, detalles5, detalles4 };
    }

    function generarSugerencia() {
      if (usuarioPlan === 'free' && juegoActual !== 'historico_melate') {
        alert('🔒 Las sugerencias para este sorteo requieren el Plan Oro.');
        return;
      }
      const bolsa = new Set();
      while (bolsa.size < 6) {
        bolsa.add(Math.floor(Math.random() * maxNumActual) + 1);
      }
      const propuesta = Array.from(bolsa).sort((a, b) => a - b);
      sugerenciaActual = propuesta; 

      const suma = propuesta.reduce((a, b) => a + b, 0);
      const minSuma = maxNumActual === 39 ? 80 : 120;
      const maxSuma = maxNumActual === 39 ? 160 : 220;
      const sumaOk = suma >= minSuma && suma <= maxSuma;
      const valHist = verificarUnicidad(propuesta);

      let calientesCount = 0;
      let friosCount = 0;
      let tibiosCount = 0;
      let paresCount = 0;
      let imparesCount = 0;

      propuesta.forEach(n => {
        if (calientesGlobales.includes(n)) calientesCount++;
        else if (friosGlobales.includes(n)) friosCount++;
        else tibiosCount++;

        if (n % 2 === 0) paresCount++;
        else imparesCount++;
      });

      const esferasHtml = propuesta.map(n => {
        let clase = '';
        let estilo3D = 'background: radial-gradient(circle at 30% 30%, #38bdf8, #0369a1); box-shadow: inset -3px -3px 6px rgba(0,0,0,0.6), 0 3px 6px rgba(0,0,0,0.4);';
        if (calientesGlobales.includes(n)) {
          clase = ' hot';
          estilo3D = 'background: radial-gradient(circle at 30% 30%, #f87171, #b91c1c); box-shadow: inset -3px -3px 6px rgba(0,0,0,0.6), 0 3px 6px rgba(0,0,0,0.4);';
        } else if (friosGlobales.includes(n)) {
          clase = ' cold';
          estilo3D = 'background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8); box-shadow: inset -3px -3px 6px rgba(0,0,0,0.6), 0 3px 6px rgba(0,0,0,0.4);';
        }
        return '<div class="ball' + clase + '" style="' + estilo3D + '">' + n + '</div>';
      }).join('');

      let partesTemp = [];
      if (calientesCount > 0) partesTemp.push(calientesCount + (calientesCount === 1 ? ' número caliente' : ' números calientes'));
      if (tibiosCount > 0) partesTemp.push(tibiosCount + (tibiosCount === 1 ? ' número tibio' : ' números tibios'));
      if (friosCount > 0) partesTemp.push(friosCount + (friosCount === 1 ? ' número frío' : ' números fríos'));

      let textoDescriptivo = 'Esta combinación para <strong>' + NOMBRES_JUEGOS[juegoActual] + '</strong> incluye ' + partesTemp.join(', ') + ', ' + paresCount + ' pares y ' + imparesCount + ' impares, con una suma total de <strong>' + suma + ' pts</strong> (' + (sumaOk ? 'en rango aceptable' : 'fuera de rango') + ').';

      document.getElementById('sugerencia-result').innerHTML = '<div class="balls-container" style="margin-bottom: 6px;">' + esferasHtml + '</div>' +
        '<div style="background: #0f172a; padding: 6px; border-radius: 5px; border: 1px solid #1e293b; margin-bottom: 6px; font-size: 0.68rem; line-height: 1.3; color: #cbd5e1; text-align: left;">' +
        '💡 ' + textoDescriptivo +
        '</div>' +
        '<div style="background: #0f172a; padding: 5px; border-radius: 5px; border: 1px solid #1e293b; margin-bottom: 5px; font-size: 0.7rem;">' +
        '<div class="metric-row" style="border:none; padding:0;">' +
        '<span class="metric-label">Suma Total:</span>' +
        '<span class="metric-value ' + (sumaOk ? 'status-ok' : 'status-out') + '">' + suma + ' pts (' + (sumaOk ? 'En Rango' : 'Fuera') + ')</span>' +
        '</div>' +
        '<div class="metric-row" style="border:none; padding:2px 0 0 0;">' +
        '<span class="metric-label">Validación Histórica:</span>' +
        '<span class="metric-value" style="color: ' + (valHist.repetido ? '#ef4444' : '#22c55e') + ';">' +
        (valHist.repetido ? 'Salió en sorteo #' + valHist.sorteoEncontrado : '✅ ¡Nunca ha salido!') +
        '</span>' +
        '</div>' +
        '</div>' +
        '<button class="btn-action" style="background: #0284c7; margin-bottom: 4px;" onclick="verSugerenciaEnRadar([' + propuesta.join(',') + '])">🎯 Ver en Radar</button>' +
        '<button class="btn-action" style="background: #10b981;" onclick="guardarSugerenciaDirecta(\'' + propuesta.join(',') + '\')">💾 Guardar Boleto</button>' +
        '<div id="msg-guardar-sugerencia" style="margin-top: 4px; font-size: 0.65rem; text-align: center;"></div>';
    }

    async function guardarSugerenciaDirecta(numsStr) {
      const numerosArr = numsStr.split(',').map(Number);
      const alias = prompt('Nombre o alias para este boleto:', 'Boleto ' + NOMBRES_JUEGOS[juegoActual]);
      if (alias === null) return;

      const { error } = await db.from('mis_jugadas').insert([
        { juego: juegoActual, numeros: numerosArr, alias: alias || 'Mi Boleto' }
      ]);

      const msgEl = document.getElementById('msg-guardar-sugerencia') || document.getElementById('msg-guardar-radar');
      if (msgEl) {
        msgEl.innerHTML = error ? '<span style="color:#ef4444;">Error: ' + error.message + '</span>' : '<span style="color:#22c55e;">¡Guardado con éxito! 🎟️</span>';
      }
      if (document.getElementById('tab-jugadas').classList.contains('active')) {
        cargarMisJugadas();
      }
    }

    async function guardarJugada() {
      const alias = document.getElementById('jugada-alias').value;
      const rawNums = document.getElementById('jugada-numeros').value;
      const numerosArr = rawNums.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));

      if (numerosArr.length !== 6) {
        alert('Ingresa exactamente 6 números separados por comas.');
        return;
      }

      const { error } = await db.from('mis_jugadas').insert([
        { juego: juegoActual, numeros: numerosArr, alias: alias || 'Mi Boleto' }
      ]);

      if (error) alert('Error: ' + error.message);
      else {
        document.getElementById('jugada-alias').value = '';
        document.getElementById('jugada-numeros').value = '';
        cargarMisJugadas();
      }
    }

    async function eliminarJugada(id) {
      if (!confirm('¿Deseas eliminar este boleto?')) return;
      const { error } = await db.from('mis_jugadas').delete().eq('id', id);
      if (error) {
        alert('Error al eliminar de Supabase: ' + error.message);
      } else {
        cargarMisJugadas();
      }
    }

    async function cargarMisJugadas() {
      const container = document.getElementById('mis-jugadas-lista');
      container.innerHTML = '<div class="loader">Cargando...</div>';

      const { data, error } = await db
        .from('mis_jugadas')
        .select('*')
        .order('fecha_registro', { ascending: false });

      if (error || !data || data.length === 0) {
        container.innerHTML = '<div style="color:#8c9ba5; font-size:0.68rem; padding:6px 0; text-align:center;">No hay jugadas guardadas.</div>';
        return;
      }

      let htmlAcumulado = '';
      for (let j of data) {
        const historialJuego = await obtenerHistorialJuego(j.juego);
        const analisis = analizarCoincidenciasParcialesConHistorial(j.numeros, historialJuego);
        const nombreJuegoTag = NOMBRES_JUEGOS[j.juego] || 'Melate';
        
        let estadoExactoHtml = analisis.aciertos6 > 0 
          ? '<span style="color:#ef4444;">Salió en #' + analisis.sorteos6.join(', #') + '</span>' 
          : '<span style="color:#22c55e;">✅ Nunca ha salido (6/6)</span>';

        let detallesAciertosHtml = '';
        if (analisis.aciertos5 > 0 || analisis.aciertos4 > 0) {
          detallesAciertosHtml += '<div style="margin-top: 4px; display: flex; flex-direction: column; gap: 2px;">';
          
          analisis.detalles5.forEach(d => {
            detallesAciertosHtml += '<div style="font-size: 0.55rem; color: #38bdf8; background: #0b111e; padding: 2px 4px; border-radius: 3px; border: 1px solid #1e293b;">' +
              '✦ <b>5 aciertos</b> (Sorteo #' + d.sorteo + '): <span style="color:#fff;">[ ' + d.numeros.join(', ') + ' ]</span>' +
              '</div>';
          });

          analisis.detalles4.forEach(d => {
            detallesAciertosHtml += '<div style="font-size: 0.55rem; color: #eab308; background: #0b111e; padding: 2px 4px; border-radius: 3px; border: 1px solid #1e293b;">' +
              '✦ <b>4 aciertos</b> (Sorteo #' + d.sorteo + '): <span style="color:#fff;">[ ' + d.numeros.join(', ') + ' ]</span>' +
              '</div>';
          });

          detallesAciertosHtml += '</div>';
        }

        htmlAcumulado += '<div style="background:#0f172a; padding:6px; border-radius:5px; margin-bottom:5px; border: 1px solid #1e293b; position:relative;">' +
          '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">' +
          '<div style="display:flex; align-items:center; gap:4px; overflow:hidden;">' +
          '<strong style="font-size:0.68rem; color:#38bdf8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + j.alias + '</strong>' +
          '<span style="font-size:0.52rem; background:#1e293b; color:#eab308; padding:1px 4px; border-radius:3px; border:1px solid #334155; white-space:nowrap;">' + nombreJuegoTag + '</span>' +
          '</div>' +
          '<div style="display:flex; align-items:center; gap:6px;">' +
          '<div style="font-size:0.58rem; white-space:nowrap;">' + estadoExactoHtml + '</div>' +
          '<button onclick="eliminarJugada(\'' + j.id + '\')" style="background:transparent; border:none; cursor:pointer; font-size:0.85rem; padding:0 2px;" title="Eliminar boleto">🗑️</button>' +
          '</div>' +
          '</div>' +
          '<div class="balls-container" style="justify-content:flex-start; gap:4px; margin-bottom: 4px;">' +
          j.numeros.map(n => '<div class="ball" style="width:22px; height:22px; font-size:0.55rem; background: radial-gradient(circle at 30% 30%, #38bdf8, #0369a1); box-shadow: inset -2px -2px 4px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.4);">' + n + '</div>').join('') +
          '</div>' +
          '<div style="display:flex; justify-content:space-between; align-items:center; font-size:0.58rem; background:#161f30; padding:3px 5px; border-radius:4px; border:1px solid #1e293b; color:#94a3b8; margin-bottom: 4px;">' +
          '<span>🎯 Parciales históricos:</span>' +
          '<span style="color:#38bdf8;"><strong>5 aciertos:</strong> ' + analisis.aciertos5 + 'v</span>' +
          '<span style="color:#eab308;"><strong>4 aciertos:</strong> ' + analisis.aciertos4 + 'v</span>' +
          '</div>' +
          detallesAciertosHtml +
          '<button class="btn-action" style="background: #0284c7; font-size: 0.65rem; padding: 5px; margin-top: 4px;" onclick="verBoletoEnRadar(\'' + j.juego + '\', [' + j.numeros.join(',') + '])">🎯 Ver en Radar</button>' +
          '</div>';
      }
      container.innerHTML = htmlAcumulado;
    }

    function extraerNumeros(sorteo) {
      if (!sorteo) return [];
      if (sorteo.r1 !== undefined) return [sorteo.r1, sorteo.r2, sorteo.r3, sorteo.r4, sorteo.r5, sorteo.r6].map(Number);
      if (sorteo.n1 !== undefined) return [sorteo.n1, sorteo.n2, sorteo.n3, sorteo.n4, sorteo.n5, sorteo.n6].map(Number);
      if (sorteo.rev1 !== undefined) return [sorteo.rev1, sorteo.rev2, sorteo.rev3, sorteo.rev4, sorteo.rev5, sorteo.rev6].map(Number);
      if (Array.isArray(sorteo.numeros)) return sorteo.numeros.map(Number);
      return [];
    }

    document.addEventListener('DOMContentLoaded', async () => {
      verificarEstadoPrueba();
      aplicarRestriccionesPlan();
      await cargarDatosCompletos();
      setTimeout(mostrarPistaZoomMovil, 1200);
    });
  </script>
</body>
</html>
